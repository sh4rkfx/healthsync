name: Sync Garmin and Hevy

on:
  schedule:
    - cron: "30 6 * * *" # 07:30 CET / 08:30 CEST, after the night's sleep and HRV are uploaded
  workflow_dispatch:
    inputs:
      days:
        description: Days to fetch (use 365 for the initial backfill)
        required: false
        default: "30"

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GARMIN_TOKEN_DIR: .garmin-tokens # inside the workspace (git-ignored) so hashFiles() can see it
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Garmin may rotate the refresh token on every run, so the latest tokens are
      # carried from run to run in the Actions cache. The GARMIN_TOKENS_JSON secret
      # is only the fallback when no cached tokens exist or they stopped working.
      - name: Restore Garmin tokens
        uses: actions/cache/restore@v4
        with:
          path: .garmin-tokens
          key: garmin-tokens-${{ github.run_id }}
          restore-keys: garmin-tokens-

      - name: Fetch data
        env:
          GARMIN_TOKENS_JSON: ${{ secrets.GARMIN_TOKENS_JSON }}
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
          DAYS: ${{ inputs.days || '30' }}
        run: python -m healthsync sync --days "$DAYS"

      # Recomputes data/insights.json from whatever data is available, even after a partial sync.
      - name: Analyze relationships
        if: ${{ !cancelled() }}
        run: python -m healthsync analyze

      - name: Save Garmin tokens
        if: ${{ !cancelled() && hashFiles('.garmin-tokens/garmin_tokens.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .garmin-tokens
          key: garmin-tokens-${{ github.run_id }}

      # Runs even if one source failed, so partial data is not lost.
      - name: Commit updated data
        if: ${{ !cancelled() }}
        run: |
          [ -d data ] || { echo "No data directory, nothing to commit."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Update data $(date -u +%F)"
          git pull --rebase
          git push
