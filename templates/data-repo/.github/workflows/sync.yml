# Daily sync for the private data repository. It checks out the public healthsync code,
# fetches Garmin and Hevy data into this repository and commits the changed files.
# Runs here and not in the code repository, so logs, caches and secrets stay private.
name: Sync Garmin and Hevy

on:
  schedule:
    - cron: "30 6 * * *" # 07:30 CET / 08:30 CEST, after the night's sleep and HRV are uploaded
  workflow_dispatch:
    inputs:
      days:
        description: Days to fetch (use 365 for the initial backfill)
        required: false
        default: "30"
      yazio_dump_date:
        description: "Optional, YYYY-MM-DD: attach the raw YAZIO responses of that day as a private artifact"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

env:
  # Public repository with the healthsync code; set the repository variable to use a fork
  CODE_REPO: ${{ vars.HEALTHSYNC_CODE_REPO || 'sh4rkfx/healthsync' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GARMIN_TOKEN_DIR: .garmin-tokens # inside the workspace so hashFiles() can see it
      YAZIO_TOKEN_DIR: .yazio-tokens
      HEALTHSYNC_DATA_DIR: data # the checkout of this repository, see below
    steps:
      - name: Check out the healthsync code
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CODE_REPO }}
          persist-credentials: false

      # Always the current tip of main. Without `ref`, a delayed scheduled run can start from an
      # older commit and then fail to rebase onto the newer data commit.
      - name: Check out this data repository
        uses: actions/checkout@v4
        with:
          ref: main
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Garmin may rotate the refresh token on every run, so the latest tokens are
      # carried from run to run in the Actions cache. The GARMIN_TOKENS_JSON secret
      # is only the fallback when no cached tokens exist or they stopped working.
      - name: Restore Garmin tokens
        uses: actions/cache/restore@v4
        with:
          path: .garmin-tokens
          key: garmin-tokens-${{ github.run_id }}
          restore-keys: garmin-tokens-

      # Same idea for YAZIO: the refresh token may rotate, so the newest one is carried in the cache.
      # Optional: without the YAZIO_TOKENS_JSON secret and a cached token, YAZIO is skipped.
      - name: Restore YAZIO tokens
        uses: actions/cache/restore@v4
        with:
          path: .yazio-tokens
          key: yazio-tokens-${{ github.run_id }}
          restore-keys: yazio-tokens-

      - name: Fetch data
        env:
          GARMIN_TOKENS_JSON: ${{ secrets.GARMIN_TOKENS_JSON }}
          YAZIO_TOKENS_JSON: ${{ secrets.YAZIO_TOKENS_JSON }}
          # Optional: log in from here. Set both for one run, then delete YAZIO_PASSWORD again.
          YAZIO_EMAIL: ${{ secrets.YAZIO_EMAIL }}
          YAZIO_PASSWORD: ${{ secrets.YAZIO_PASSWORD }}
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
          DAYS: ${{ inputs.days || '30' }}
        run: python -m healthsync sync --days "$DAYS"

      # Recomputes insights.json from whatever data is available, even after a partial sync.
      - name: Analyze relationships
        if: ${{ !cancelled() }}
        run: python -m healthsync analyze

      - name: Save Garmin tokens
        if: ${{ !cancelled() && hashFiles('.garmin-tokens/garmin_tokens.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .garmin-tokens
          key: garmin-tokens-${{ github.run_id }}

      # Only to check the field mapping once. The artifact contains health data and expires after a day.
      - name: Dump raw YAZIO data
        if: ${{ !cancelled() && inputs.yazio_dump_date != '' }}
        env:
          YAZIO_TOKENS_JSON: ${{ secrets.YAZIO_TOKENS_JSON }}
          YAZIO_EMAIL: ${{ secrets.YAZIO_EMAIL }}
          YAZIO_PASSWORD: ${{ secrets.YAZIO_PASSWORD }}
          DUMP_DATE: ${{ inputs.yazio_dump_date }}
        run: python -m healthsync dump-yazio --date "$DUMP_DATE"

      - name: Upload raw YAZIO data
        if: ${{ !cancelled() && inputs.yazio_dump_date != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: yazio-raw
          path: debug/
          retention-days: 1
          if-no-files-found: ignore

      - name: Save YAZIO tokens
        if: ${{ !cancelled() && hashFiles('.yazio-tokens/yazio_tokens.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .yazio-tokens
          key: yazio-tokens-${{ github.run_id }}

      # Runs even if one source failed, so partial data is not lost.
      - name: Commit updated data
        if: ${{ !cancelled() }}
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- '*.csv' '*.json'
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Update data $(date -u +%F)"
          git pull --rebase
          git push
